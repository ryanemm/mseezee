# Copy to /etc/apache2/sites-available/mseezee.conf on the VPS, then:
#   a2enmod proxy proxy_http headers
#   a2ensite mseezee
#   apache2ctl configtest && systemctl reload apache2
#   certbot --apache -d mseezee.co.za -d www.mseezee.co.za
#
# certbot rewrites this file to add the :443 block and the SSL certificate
# paths, and turns this :80 block into an HTTP→HTTPS redirect. Don't
# hand-edit the SSL block certbot adds — let it manage renewal.

<VirtualHost *:80>
    ServerName mseezee.co.za
    ServerAlias www.mseezee.co.za

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3210/
    ProxyPassReverse / http://127.0.0.1:3210/
    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog ${APACHE_LOG_DIR}/mseezee-error.log
    CustomLog ${APACHE_LOG_DIR}/mseezee-access.log combined
</VirtualHost>
